name: Bug report
description: Something does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems (prompt injection, data leakage, personal-data
        handling, answers that invent government policy) go through a private security advisory
        instead; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact command, and the question text if the bug is about an answer.
      placeholder: |
        uv run python scripts/demo.py "..."
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which LLM provider was in use (LLM_PROVIDER)?
      options:
        - mock
        - claude
        - openai
        - gemini
        - falcon-arabic
        - not relevant
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and `uv --version`.
      placeholder: Windows 11, Python 3.12.13, uv 0.12.19
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste the relevant output. It is shown as code.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you open this issue
      options:
        - label: I removed API keys, tokens and personal data from everything I pasted.
          required: true
