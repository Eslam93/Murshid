version = 1
SPDX-PackageName = "Murshid"
SPDX-PackageSupplier = "Eslam Hamed"
SPDX-PackageDownloadLocation = "https://github.com/Eslam93/Murshid"

# Eslam Hamed's files that take no licence header: documentation, the synthetic corpus and the
# question sets under data/, the bench's recorded runs and reports under bench/ (the answers in
# them were generated by Claude and OpenAI models in his bench runs), the demo page built from
# them, configuration, CI and the lockfile. His Python files carry the header themselves.
[[annotations]]
path = [
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "CITATION.cff",
    "docs/**",
    "data/**",
    "bench/**",
    ".github/**",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    ".gitignore",
    ".gitattributes",
    ".env.example",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Eslam Hamed"
SPDX-License-Identifier = "MIT"

# The ToolKit cores under src/murshid/_toolkit, copied byte for byte from his ToolKit repository
# (src/murshid/_toolkit/README.md names the commit): his code, published here under MIT with his
# approval of 2026-11-19. Their files carry no header, so the copies stay identical.
[[annotations]]
path = "src/murshid/_toolkit/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Eslam Hamed"
SPDX-License-Identifier = "MIT"

# His Python files carry the same notice in their header. reuse guesses a file's encoding from
# its first 2048 bytes, and when that slice ends inside an Arabic character it treats the file as
# binary and skips the header (src/murshid/critic.py did). Listing the files here keeps them
# covered whatever their bytes.
[[annotations]]
path = [
    "conftest.py",
    "src/murshid/*.py",
    "src/murshid/bench/*.py",
    "src/murshid/providers/*.py",
    "tests/*.py",
    "scripts/*.py",
    "tools/*.py",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Eslam Hamed"
SPDX-License-Identifier = "MIT"
